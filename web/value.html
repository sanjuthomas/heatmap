<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S&amp;P 500 Value Map</title>
    <meta
      name="description"
      content="S&P 500 stocks trading below the nightly fair value. Box size is the market-cap gap. Color is how far below that value the price sits."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>S&amp;P 500</h1>
        <nav class="pages" aria-label="Pages">
          <a href="./index.html">Heatmap</a>
          <a href="./value.html" aria-current="page">Value map</a>
        </nav>
        <p id="brand-note"></p>
      </div>
      <div class="hero" id="hero">
        <span class="hero-label" id="hero-label">Below both values</span>
        <strong id="hero-value">—</strong>
      </div>
      <div class="counts" id="counts"></div>
      <div class="status" id="status"></div>
      <div class="controls">
        <div class="periods" role="group" aria-label="Valuation method">
          <button type="button" data-mode="peer" aria-pressed="false">Peer value</button>
          <button type="button" data-mode="cash" aria-pressed="false">Cash flow</button>
          <button type="button" data-mode="both" aria-pressed="true">Both</button>
        </div>
        <input id="search" type="search" placeholder="Search ticker or company" autocomplete="off" />
        <select id="sector" aria-label="Sector">
          <option value="all">All sectors</option>
        </select>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span id="legend-min">0</span>
        <div class="legend-bar cheap"></div>
        <span id="legend-max">40% below</span>
      </div>
      <p class="disclaimer" id="disclaimer"></p>
    </header>
    <main id="map">
      <svg id="heatmap"></svg>
      <div id="overlay" class="overlay">Loading the value map…</div>
      <p id="search-empty" class="search-empty" hidden>No matching stocks.</p>
    </main>
    <div id="tooltip" class="tooltip" hidden></div>
    <script type="module" src="./src/value.js"></script>
  </body>
</html>
